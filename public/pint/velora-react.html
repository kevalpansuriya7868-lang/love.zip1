<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORA - React Experience</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#FAF8F4',
                        accent: '#D4AF37',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Framer Motion (UMD) -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Babel Standalone (To compile JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lenis for Smooth Scroll -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>

    <style>
        body {
            background-color: #FAF8F4;
            color: #181818;
            cursor: none;
        }
        
        .cursor-glow {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.4) 0%, transparent 70%);
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* React Masonry CSS requires these classes to work with our custom implementation */
        .my-masonry-grid {
            display: flex;
            margin-left: -24px; /* gutter size offset */
            width: auto;
        }
        .my-masonry-grid_column {
            padding-left: 24px; /* gutter size */
            background-clip: padding-box;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (hover: none) and (pointer: coarse) {
            body { cursor: auto; }
            .cursor-glow { display: none; }
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen relative font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // ==========================================
        // INSERT YOUR PEXELS API KEY HERE
        // ==========================================
        const PEXELS_API_KEY = 'YOUR_API_KEY_HERE';

        // --- Custom Hooks ---

        // Custom Masonry Component to replace react-masonry-css
        const MasonryGrid = ({ children, breakpointCols }) => {
            const [cols, setCols] = useState(breakpointCols.default);

            useEffect(() => {
                const updateCols = () => {
                    let matchedCols = breakpointCols.default;
                    const widths = Object.keys(breakpointCols).filter(k => k !== 'default').map(Number).sort((a,b)=>b-a);
                    for(let w of widths) {
                        if(window.innerWidth <= w) {
                            matchedCols = breakpointCols[w];
                        }
                    }
                    setCols(matchedCols);
                };
                updateCols();
                window.addEventListener('resize', updateCols);
                return () => window.removeEventListener('resize', updateCols);
            }, [breakpointCols]);

            const columnWrapper = {};
            for (let i = 0; i < cols; i++) {
                columnWrapper[`column${i}`] = [];
            }
            
            React.Children.forEach(children, (child, index) => {
                const columnIndex = index % cols;
                columnWrapper[`column${columnIndex}`].push(child);
            });

            const columnWidth = `${100 / cols}%`;

            return (
                <div className="my-masonry-grid">
                    {Object.keys(columnWrapper).map((col, i) => (
                        <div key={i} className="my-masonry-grid_column" style={{ width: columnWidth }}>
                            {columnWrapper[col]}
                        </div>
                    ))}
                </div>
            );
        };

        // --- Components ---

        const Cursor = () => {
            const cursorRef = useRef(null);
            useEffect(() => {
                const moveCursor = (e) => {
                    if(cursorRef.current) {
                        cursorRef.current.style.left = e.clientX + 'px';
                        cursorRef.current.style.top = e.clientY + 'px';
                    }
                };
                window.addEventListener('mousemove', moveCursor);
                return () => window.removeEventListener('mousemove', moveCursor);
            }, []);
            return <div ref={cursorRef} className="cursor-glow"></div>;
        };

        const SkeletonCard = () => {
            const heights = [300, 400, 450, 500];
            const h = useMemo(() => heights[Math.floor(Math.random() * heights.length)], []);
            return (
                <div 
                    className="mb-6 rounded-[28px] overflow-hidden bg-gradient-to-r from-gray-200 via-gray-100 to-gray-200"
                    style={{ height: h, backgroundSize: '200% 100%', animation: 'skeleton-loading 1.5s infinite' }}
                />
            );
        };

        const ImageCard = ({ photo }) => {
            const [loaded, setLoaded] = useState(false);
            const imageUrl = photo.src?.large || photo.src?.portrait || photo.imageUrl; 
            const altText = photo.alt || photo.altText || 'Inspiration';
            const h = photo.mockHeight || 'auto'; // For mock fallback

            return (
                <motion.div 
                    initial={{ opacity: 0, y: 30 }}
                    animate={{ opacity: 1, y: 0 }}
                    transition={{ duration: 0.5, ease: "easeOut" }}
                    whileHover={{ y: -8, scale: 1.02 }}
                    className="relative mb-6 rounded-[28px] overflow-hidden bg-white shadow-sm hover:shadow-2xl group"
                >
                    {!loaded && <SkeletonCard />}
                    <img 
                        src={imageUrl} 
                        alt={altText} 
                        onLoad={() => setLoaded(true)}
                        className={`w-full block rounded-[28px] object-cover transition-transform duration-700 group-hover:scale-105 ${loaded ? 'opacity-100' : 'opacity-0 absolute inset-0'}`}
                        style={{ height: loaded ? 'auto' : h }}
                        loading="lazy"
                    />
                    
                    {/* Glass Overlay */}
                    <div className="absolute inset-0 bg-gradient-to-b from-black/10 to-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-5 pointer-events-none group-hover:pointer-events-auto rounded-[28px]">
                        <div className="flex justify-end">
                            <motion.button 
                                whileHover={{ scale: 1.05 }}
                                whileTap={{ scale: 0.95 }}
                                className="bg-accent text-white px-5 py-2 rounded-full font-semibold text-sm shadow-lg pointer-events-auto"
                            >
                                Save
                            </motion.button>
                        </div>
                        <div className="flex justify-end gap-3">
                            {['heart', 'download-simple', 'dots-three'].map(icon => (
                                <motion.button 
                                    key={icon}
                                    whileHover={{ scale: 1.1, backgroundColor: '#fff' }}
                                    className="w-10 h-10 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center text-gray-800 shadow-sm pointer-events-auto transition-colors"
                                >
                                    <i className={`ph ph-${icon} text-xl`}></i>
                                </motion.button>
                            ))}
                        </div>
                    </div>
                </motion.div>
            );
        };

        const App = () => {
            const [query, setQuery] = useState('luxury aesthetics');
            const [inputValue, setInputValue] = useState('');
            const [images, setImages] = useState([]);
            const [page, setPage] = useState(1);
            const [loading, setLoading] = useState(true);
            const [suggestionsOpen, setSuggestionsOpen] = useState(false);
            const [cache, setCache] = useState({});

            const popularTags = ['Fashion', 'Sneakers', 'Wallpapers', 'Nature', 'Krishna', 'Cars', 'Gaming', 'AI Art', 'Interior Design', 'Anime', 'Couple Photos'];

            // Initialize smooth scroll
            useEffect(() => {
                const lenis = new window.Lenis({ duration: 1.2, smooth: true });
                const raf = (time) => { lenis.raf(time); requestAnimationFrame(raf); };
                requestAnimationFrame(raf);
                return () => lenis.destroy();
            }, []);

            // Fetch Logic
            const fetchImages = async (searchQuery, pageNum, isNewSearch) => {
                setLoading(true);
                
                // Cache Check
                if(isNewSearch && cache[searchQuery]) {
                    setImages(cache[searchQuery].items);
                    setPage(cache[searchQuery].page);
                    setLoading(false);
                    return;
                }

                try {
                    const response = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(searchQuery)}&page=${pageNum}&per_page=40&orientation=portrait`, {
                        headers: { Authorization: PEXELS_API_KEY }
                    });
                    
                    if(!response.ok) throw new Error(response.status);
                    
                    const data = await response.json();
                    
                    if(data.photos && data.photos.length > 0) {
                        setImages(prev => {
                            const newItems = isNewSearch ? data.photos : [...prev, ...data.photos];
                            // Update Cache
                            setCache(c => ({...c, [searchQuery]: { items: newItems, page: pageNum + 1 }}));
                            return newItems;
                        });
                        setPage(pageNum + 1);
                    } else if (pageNum === 1) {
                        handleMockFallback(searchQuery, isNewSearch, pageNum);
                    }
                } catch (err) {
                    console.error("API Error. Falling back to mock data.", err);
                    handleMockFallback(searchQuery, isNewSearch, pageNum);
                } finally {
                    setLoading(false);
                }
            };

            const handleMockFallback = (searchQuery, isNewSearch, pageNum) => {
                const mockImages = Array.from({length: 12}).map(() => {
                    const h = [300, 400, 500, 600][Math.floor(Math.random()*4)];
                    return {
                        id: Math.random().toString(),
                        imageUrl: `https://source.unsplash.com/random/400x${h}/?${encodeURIComponent(searchQuery)}&sig=${Math.random()}`,
                        altText: searchQuery,
                        mockHeight: h
                    };
                });

                setImages(prev => {
                    const newItems = isNewSearch ? mockImages : [...prev, ...mockImages];
                    setCache(c => ({...c, [searchQuery]: { items: newItems, page: pageNum + 1 }}));
                    return newItems;
                });
                setPage(pageNum + 1);
            };

            // Trigger fetch on query change
            useEffect(() => {
                setImages([]); // clear for loading effect
                fetchImages(query, 1, true);
            }, [query]);

            // Infinite Scroll Listener
            useEffect(() => {
                const handleScroll = () => {
                    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800 && !loading) {
                        fetchImages(query, page, false);
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, [query, page, loading]);

            // Search Handlers
            const handleSearchSubmit = (e) => {
                if(e.key === 'Enter') {
                    const val = inputValue.trim();
                    if(val && val !== query) {
                        setQuery(val);
                        setSuggestionsOpen(false);
                    }
                }
            };

            const filteredTags = useMemo(() => {
                const filtered = popularTags.filter(t => t.toLowerCase().includes(inputValue.toLowerCase()));
                if(filtered.length === 0 && inputValue) filtered.push(inputValue);
                return filtered.slice(0, 5);
            }, [inputValue]);

            const breakpoints = { default: 6, 1024: 4, 768: 2 };

            return (
                <div className="min-h-screen">
                    <Cursor />
                    
                    {/* Header */}
                    <header className="fixed top-0 left-0 w-full z-50 p-4 md:p-6">
                        <motion.div 
                            initial={{ y: -50, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            className="max-w-6xl mx-auto glass rounded-full px-6 py-4 flex items-center gap-4 shadow-sm hover:shadow-md transition-shadow relative"
                        >
                            <h1 className="font-heading font-bold text-2xl tracking-wide hidden md:block mr-4 text-gray-900">VELORA</h1>
                            
                            <div className="flex-1 relative">
                                <div className="flex items-center bg-white/50 rounded-full px-4 py-2 border border-black/5 focus-within:bg-white focus-within:shadow-md transition-all">
                                    <i className="ph ph-magnifying-glass text-2xl text-gray-400 mr-3"></i>
                                    <input 
                                        type="text" 
                                        placeholder="Search anything... outfits, sneakers, anime, wallpapers..." 
                                        className="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400 font-medium"
                                        value={inputValue}
                                        onChange={(e) => {
                                            setInputValue(e.target.value);
                                            setSuggestionsOpen(true);
                                        }}
                                        onFocus={() => setSuggestionsOpen(true)}
                                        onKeyDown={handleSearchSubmit}
                                    />
                                </div>
                                
                                {/* Suggestions Dropdown */}
                                <AnimatePresence>
                                    {suggestionsOpen && inputValue && (
                                        <motion.ul 
                                            initial={{ opacity: 0, y: -10 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            exit={{ opacity: 0, y: -10 }}
                                            className="absolute top-full left-0 w-full mt-2 glass rounded-2xl shadow-xl overflow-hidden z-50"
                                        >
                                            {filteredTags.map((tag, i) => (
                                                <li 
                                                    key={i}
                                                    onClick={() => {
                                                        setInputValue(tag);
                                                        setQuery(tag);
                                                        setSuggestionsOpen(false);
                                                    }}
                                                    className="px-4 py-3 hover:bg-white/80 cursor-pointer text-gray-800 font-medium transition-colors flex items-center gap-3"
                                                >
                                                    <i className="ph ph-magnifying-glass text-gray-400"></i> {tag}
                                                </li>
                                            ))}
                                        </motion.ul>
                                    )}
                                </AnimatePresence>
                            </div>

                            <button className="w-10 h-10 rounded-full flex items-center justify-center hover:bg-black/5 text-gray-600 transition-colors"><i className="ph ph-camera text-2xl"></i></button>
                        </motion.div>
                    </header>

                    {/* Main Grid */}
                    <main className="pt-32 px-4 md:px-8 max-w-[1800px] mx-auto pb-20">
                        {images.length === 0 && loading ? (
                            <MasonryGrid breakpointCols={breakpoints}>
                                {Array.from({length: 12}).map((_, i) => <SkeletonCard key={i} />)}
                            </MasonryGrid>
                        ) : (
                            <MasonryGrid breakpointCols={breakpoints}>
                                {images.map((photo, i) => (
                                    <ImageCard key={photo.id || i} photo={photo} />
                                ))}
                            </MasonryGrid>
                        )}
                        
                        {/* Bottom Loader */}
                        {images.length > 0 && loading && (
                            <div className="text-center py-8">
                                <i className="ph ph-spinner animate-spin text-4xl text-accent"></i>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
